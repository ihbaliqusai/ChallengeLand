name: challenge_land
description: ChallengeLand quiz game with online multiplayer, matchmaking, invitations, friends, leaderboards, and Firebase-backed profiles.
publish_to: "none"
version: 3.8.10+50

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.1
  cloud_firestore: ^5.6.10
  google_sign_in: ^6.3.0
  provider: ^6.1.2
  share_plus: ^10.0.2
  google_mobile_ads: ^5.3.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  fake_cloud_firestore: ^3.1.0
  clock: ^1.1.2

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  # Keep the complete square artwork; adaptive icons allow launcher masking.

flutter:
  uses-material-design: true
  assets:
